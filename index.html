<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#18395b"><title>Stundenplan</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" href="icon-192.png"><link rel="apple-touch-icon" href="icon-180.png"><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#1b2c42;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}header{background:#18395b;color:white;padding:18px 16px 14px}header h1{font-size:22px;margin:0 0 14px}nav,.switch{display:flex;gap:8px}button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:10px 16px;background:#e2e9f2;color:#1c3d5f}button.active{background:#fff;color:#18395b;font-weight:750}.switch{margin:16px auto;max-width:1100px;padding:0 14px}.switch button.active{background:#18395b;color:white}main{max-width:1100px;margin:auto;padding:0 14px 32px}.week{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px}.day{min-width:0}.dayhead{width:100%;background:#dce7f4;font-weight:700;margin-bottom:8px}.dayhead.today{background:#bed7f6}.lesson{background:white;border-radius:11px;padding:10px 8px;margin-bottom:7px;min-height:76px;box-shadow:0 2px 8px #17365b0c;border-left:4px solid var(--accent,#8fa8c6)}.num{font-size:11px;color:#63758c}.subject{font-weight:750;font-size:17px}.room{font-size:12px;color:#5b6b7e;margin-top:3px}.alternative{border-top:1px dashed #cbd5e1;margin-top:6px;padding-top:6px}.single .lesson{min-height:82px;padding:15px}.single .subject{font-size:21px}.single .room{font-size:15px}.daynav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px}.daynav h2{font-size:20px;margin:0}.hint{font-size:13px;color:#64748b;text-align:center;margin-top:18px}.empty{padding:20px;background:white;border-radius:12px}@media(max-width:690px){.week{gap:4px}main{padding:0 5px 28px}.dayhead{font-size:11px;padding:9px 1px}.lesson{padding:7px 3px;min-height:85px;border-radius:7px;border-left-width:3px}.week .subject{font-size:12px;overflow-wrap:anywhere}.week .room{font-size:10px;overflow-wrap:anywhere}.week .num{font-size:9px;line-height:1.25}.week .alternative{padding-top:3px;margin-top:3px}.single{max-width:600px;margin:auto;padding:0 10px}.switch{margin:12px auto}header{padding:15px 12px}}
.school-logo{width:38px;height:38px;object-fit:cover;border-radius:9px;vertical-align:middle;margin-right:11px}header h1{display:flex;align-items:center}</style></head><body><header><h1><img src="icon-192.png" alt="Schullogo" class="school-logo">Stundenplan</h1><nav id="students"></nav></header><div class="switch"><button id="weekBtn">Woche</button><button id="dayBtn">Tag</button></div><main id="app"></main><script>
const days=['Montag','Dienstag','Mittwoch','Donnerstag','Freitag'];const colors={'G':'#64748b','F/L':'#6366f1','L/F':'#6366f1','MI2/NuT2':'#14b8a6','EI_2/NuT1':'#14b8a6','EI_1/MI1':'#14b8a6','D':'#f59e0b','M':'#3b82f6','M Int':'#3b82f6','E':'#16a34a','E Int':'#16a34a','Mu':'#a855f7','Ev':'#e8796b','Sw':'#0ea5e9','Sw3':'#0ea5e9','Geo':'#d97706','Ku':'#ec4899','NuT':'#14b8a6','NuT1':'#14b8a6','NuT2':'#14b8a6'};
let data=null,student=localStorage.getItem('student')||'j',view=localStorage.getItem('view')||'week';const today=new Date().getDay();let day=today>=1&&today<=5?today-1:0;
const $=id=>document.getElementById(id);function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e}
function lesson(entry,n){const box=el('div','lesson');const options=Array.isArray(entry)?entry:[entry];box.style.setProperty('--accent',colors[options[0].subject]||'#8fa8c6');box.append(el('div','num',n+'. Stunde · '+(data.times?.[n]||''))); options.forEach((item,i)=>{const group=el('div',i?'alternative':'');group.append(el('div','subject',item.subject),el('div','room',item.room));box.append(group)});return box}
function render(){if(!data)return;const s=data.students.find(x=>x.id===student)||data.students[0];student=s.id;const nav=$('students');nav.replaceChildren();data.students.forEach(x=>{const b=el('button',x.id===student?'active':'',x.name+' · '+x.class);b.onclick=()=>{student=x.id;localStorage.setItem('student',student);render()};nav.append(b)});$('weekBtn').className=view==='week'?'active':'';$('dayBtn').className=view==='day'?'active':'';const app=$('app');app.replaceChildren();if(view==='week'){const grid=el('div','week');s.days.forEach((entries,i)=>{const col=el('section','day');const head=el('button','dayhead'+(i===today-1?' today':''),days[i]);head.onclick=()=>{day=i;setView('day')};col.append(head);entries.forEach((entry,n)=>col.append(lesson(entry,n+1)));grid.append(col)});app.append(grid)}else{const wrap=el('div','single'),nav=el('div','daynav'),prev=el('button','','‹'),next=el('button','','›');prev.setAttribute('aria-label','Vorheriger Schultag');next.setAttribute('aria-label','Nächster Schultag');prev.onclick=()=>changeDay(-1);next.onclick=()=>changeDay(1);nav.append(prev,el('h2','',days[day]),next);wrap.append(nav);s.days[day].forEach((entry,n)=>wrap.append(lesson(entry,n+1)));wrap.append(el('div','hint','Nach links oder rechts wischen, um den Schultag zu wechseln.'));app.append(wrap)}}
function setView(v){view=v;localStorage.setItem('view',v);render()}function changeDay(step){day=(day+step+5)%5;render()}$('weekBtn').onclick=()=>setView('week');$('dayBtn').onclick=()=>setView('day');let start=null;$('app').addEventListener('touchstart',e=>{if(view==='day')start={x:e.changedTouches[0].screenX,y:e.changedTouches[0].screenY}},{passive:true});$('app').addEventListener('touchend',e=>{if(!start||view!=='day')return;const dx=e.changedTouches[0].screenX-start.x,dy=e.changedTouches[0].screenY-start.y;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.4)changeDay(dx<0?1:-1);start=null},{passive:true});
fetch('./stundenplaene.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(d=>{data=d;render()}).catch(()=>{$('app').textContent='Stundenplan konnte nicht geladen werden. Bitte die App über GitHub Pages oder einen lokalen Webserver öffnen.'});
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
