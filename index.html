<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#193959"><title>Stundenplan</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-180.png"><style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#1b2d45;background:#f2f6fc;font-size:16px}*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer;border:0;border-radius:12px;touch-action:manipulation}header{background:#193959;color:white;padding:15px max(12px,env(safe-area-inset-left)) 14px}.brand{display:flex;align-items:center;gap:12px;max-width:1180px;margin:auto}.brand img{width:46px;height:46px;object-fit:cover;border-radius:10px}.brand h1{margin:0;font-size:clamp(23px,3vw,29px);line-height:1.2}.toolbar{max-width:1180px;margin:14px auto 12px;padding:0 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}.toggle{display:flex;gap:6px;min-width:0}.toggle button{padding:11px 15px;background:#e1e9f4;color:#1d3b5a;font-weight:650;font-size:clamp(15px,2.3vw,19px);white-space:nowrap}.toggle button.active{background:#193959;color:white}.toggle button:focus-visible,.dayhead:focus-visible,.arrow:focus-visible{outline:3px solid #639bda;outline-offset:2px}main{max-width:1180px;margin:auto;padding:0 12px 35px}.week{display:grid;grid-template-columns:minmax(58px,.7fr) repeat(5,minmax(0,1fr));gap:7px}.weekhead{height:42px;border-radius:11px;background:#e0eaf6;color:#193959;font-size:clamp(12px,1.8vw,18px);font-weight:750;display:flex;justify-content:center;align-items:center;min-width:0}.dayhead{width:100%}.dayhead.today{background:#bfd9f8}.timecell,.lesson{min-height:92px;border-radius:11px;margin:0;min-width:0}.timecell{background:#e3ebf6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#24435f}.timecell strong{font-size:16px}.timecell span{font-size:14px;line-height:1.15;font-variant-numeric:tabular-nums}.lesson{background:color-mix(in srgb,var(--accent,#8fa8c6) 6%,white);border-left:4px solid var(--accent,#8fa8c6);padding:12px 10px;display:flex;flex-direction:column;justify-content:center;overflow-wrap:anywhere;box-shadow:0 1px 3px #102a4410}.subject{font-size:clamp(15px,2vw,21px);font-weight:750;line-height:1.2}.room{font-size:clamp(13px,1.6vw,17px);color:#526781;margin-top:5px;line-height:1.2}.num{font-size:15px;color:#536b86;margin-bottom:5px}.dayview{max-width:850px;margin:auto}.daynav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 12px}.daynav h2{font-size:23px;margin:0}.arrow{background:#e1e9f4;color:#193959;font-size:26px;font-weight:700;width:49px;height:49px}.viewport{overflow:hidden;touch-action:pan-y;user-select:none;-webkit-user-select:none}.track{display:flex;width:300%;transform:translateX(-33.333333%);will-change:transform}.panel{width:33.333333%;min-width:0;padding:0 2px}.panel .lesson{min-height:105px;margin-bottom:9px;padding:16px 18px}.panel .subject{font-size:24px}.panel .room{font-size:18px}.panel .num{font-size:15px}.hint{text-align:center;color:#64748b;font-size:14px;margin-top:12px}.error{background:white;border-radius:12px;padding:20px} @media(max-width:650px){header{padding:12px 12px}.brand img{width:41px;height:41px}.brand h1{font-size:23px}.toolbar{padding:0 8px;margin:12px auto;gap:4px}.toggle{gap:4px}.toggle button{font-size:15px;padding:10px 11px;border-radius:11px}main{padding:0 5px 25px}.week{grid-template-columns:53px repeat(5,minmax(0,1fr));gap:3px}.weekhead{height:35px;font-size:11px;border-radius:7px}.timecell,.week .lesson{min-height:89px;border-radius:7px}.timecell{gap:3px}.timecell strong{font-size:13px}.timecell span{font-size:11px}.week .lesson{padding:7px 3px;border-left-width:3px}.week .subject{font-size:clamp(11px,3.2vw,14px);overflow-wrap:anywhere;line-height:1.14}.week .room{font-size:clamp(10px,2.8vw,12px);overflow-wrap:anywhere;margin-top:5px}.dayview{padding:0 7px}.panel .lesson{min-height:104px}.panel .subject{font-size:24px}.daynav h2{font-size:21px}}@media(max-width:360px){.toggle button{padding:9px 8px;font-size:14px}.week{grid-template-columns:48px repeat(5,minmax(0,1fr));gap:2px}.timecell span{font-size:10px}.week .subject{font-size:11px}.week .room{font-size:10px}.weekhead{font-size:10px}}@media(prefers-reduced-motion:reduce){.track{transition:none!important}}
</style></head><body><header><div class="brand"><img src="icon-192.png" alt="Schullogo"><h1>Stundenplan</h1></div></header><div class="toolbar"><nav id="students" class="toggle" aria-label="Schüler auswählen"></nav><nav class="toggle" aria-label="Ansicht wählen"><button id="weekBtn">Woche</button><button id="dayBtn">Tag</button></nav></div><main id="app"></main><script>
const names=['Montag','Dienstag','Mittwoch','Donnerstag','Freitag'];const short=['Mo','Di','Mi','Do','Fr'];const colors={'G':'#64748b','F/L':'#6366f1','L/F':'#6366f1','MI2/NuT2':'#14b8a6','EI_2/NuT1':'#14b8a6','EI_1/MI1':'#14b8a6','D':'#f59e0b','M':'#3b82f6','E':'#16a34a','Mu':'#a855f7','Ev':'#e8796b','Sw':'#0ea5e9','Sw3':'#0ea5e9','Geo':'#d97706','Ku':'#ec4899','NuT':'#14b8a6','NuT1':'#14b8a6','NuT2':'#14b8a6'};
let data,student=localStorage.getItem('student')||'j',view=localStorage.getItem('view')||'week',day=(()=>{const d=new Date().getDay();return d>=1&&d<=5?d-1:0})();let busy=false;
const $=id=>document.getElementById(id);function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e}function current(){return data.students.find(s=>s.id===student)||data.students[0]}
function card(entry,n,detailed=false){const c=el('div','lesson'),items=Array.isArray(entry)?entry:[entry],subject=items.map(x=>x.subject).join('/'),room=items.map(x=>x.room).filter(Boolean).join('/');c.style.setProperty('--accent',colors[subject]||colors[items[0].subject]||'#8fa8c6');if(detailed)c.append(el('div','num',`${n}. Stunde · ${data.times[n-1]||''}`));c.append(el('div','subject',subject));if(room)c.append(el('div','room',room));return c}
function render(){if(!data)return;busy=false;const s=current();student=s.id;const nav=$('students');nav.replaceChildren();data.students.forEach(x=>{const b=el('button',x.id===student?'active':'',`${x.name} · ${x.class}`);b.setAttribute('aria-pressed',String(x.id===student));b.onclick=()=>{student=x.id;localStorage.setItem('student',student);render()};nav.append(b)});for(const [id,active] of [['weekBtn',view==='week'],['dayBtn',view==='day']]){$(id).className=active?'active':'';$(id).setAttribute('aria-pressed',String(active))}const app=$('app');app.replaceChildren();if(view==='week'){const grid=el('div','week');grid.append(el('div','weekhead','Std.'));names.forEach((name,i)=>{const b=el('button','weekhead dayhead'+(new Date().getDay()===i+1?' today':''),name);b.setAttribute('aria-label',name+' in Tagesansicht öffnen');b.onclick=()=>{day=i;setView('day')};grid.append(b)});const count=Math.max(data.times.length,...s.days.map(x=>x.length));for(let n=0;n<count;n++){const time=(data.times[n]||'').split(/[–-]/);const t=el('div','timecell');t.append(el('strong','',(n+1)+'.'));time.forEach(x=>t.append(el('span','',x.trim())));grid.append(t);for(let d=0;d<5;d++){grid.append(s.days[d][n]?card(s.days[d][n],n+1):el('div','lesson'))}}app.append(grid)}else{const wrap=el('section','dayview'),nav=el('div','daynav'),prev=el('button','arrow','‹'),next=el('button','arrow','›'),title=el('h2','',names[day]);prev.setAttribute('aria-label','Vorheriger Schultag');next.setAttribute('aria-label','Nächster Schultag');prev.onclick=()=>slide(-1);next.onclick=()=>slide(1);nav.append(prev,title,next);wrap.append(nav);const viewport=el('div','viewport'),track=el('div','track');for(const d of [(day+4)%5,day,(day+1)%5])track.append(panel(s.days[d]));viewport.append(track);wrap.append(viewport,el('div','hint','Nach links oder rechts wischen, um den Schultag zu wechseln.'));app.append(wrap);enableSwipe(viewport,track)}}
function panel(entries){const p=el('div','panel');entries.forEach((entry,i)=>p.append(card(entry,i+1,true)));return p}function setView(v){view=v;localStorage.setItem('view',v);render()}
function slide(dir){if(busy||view!=='day')return;busy=true;const track=document.querySelector('.track');if(!track){busy=false;return}const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;track.style.transition=reduce?'none':'transform 260ms cubic-bezier(.22,.65,.25,1)';track.style.transform=`translateX(${dir>0?'-66.666667%':'0%'})`;const finish=()=>{day=(day+dir+5)%5;render()};if(reduce)finish();else{track.addEventListener('transitionend',finish,{once:true});setTimeout(()=>{if(busy)finish()},380)}}
function enableSwipe(viewport,track){let start=null;viewport.addEventListener('touchstart',e=>{if(busy||e.touches.length!==1)return;start={x:e.touches[0].clientX,y:e.touches[0].clientY,axis:null}},{passive:true});viewport.addEventListener('touchmove',e=>{if(!start||busy)return;const dx=e.touches[0].clientX-start.x,dy=e.touches[0].clientY-start.y;if(start.axis===null&&Math.hypot(dx,dy)>9)start.axis=Math.abs(dx)>Math.abs(dy)*1.2?'x':'y';if(start.axis==='x'){const pct=dx/viewport.clientWidth*100;track.style.transition='none';track.style.transform=`translateX(calc(-33.333333% + ${Math.max(-27,Math.min(27,pct))/3}%))`}},{passive:true});viewport.addEventListener('touchend',e=>{if(!start||busy)return;const dx=e.changedTouches[0].clientX-start.x;const horizontal=start.axis==='x';start=null;if(horizontal&&Math.abs(dx)>Math.min(80,viewport.clientWidth*.2)){track.style.transition='none';track.style.transform='translateX(-33.333333%)';slide(dx<0?1:-1)}else{track.style.transition='transform 200ms ease-out';track.style.transform='translateX(-33.333333%)'}},{passive:true});viewport.addEventListener('touchcancel',()=>{start=null;track.style.transition='transform 200ms';track.style.transform='translateX(-33.333333%)'},{passive:true})}
$('weekBtn').onclick=()=>setView('week');$('dayBtn').onclick=()=>setView('day');fetch('./stundenplaene.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(d=>{data=d;render()}).catch(()=>{$('app').append(el('p','error','Die Stundenplandaten konnten nicht geladen werden. Bitte die Datei stundenplaene.json im GitHub-Repository prüfen.'))});if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
